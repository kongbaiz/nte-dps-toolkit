[package]
name = "nte-dps-tool"
version = "0.3.7"
edition = "2024"
description = "Local Windows DPS diagnostics tool for NTE."
repository = "https://github.com/kongbaiz/nte-dps-toolkit"
license = "AGPL-3.0-or-later"

[features]
default = ["desktop"]
desktop = [
    "dep:ed25519-dalek",
    "dep:semver",
    "dep:sha2",
    "dep:zip",
]
cli = []
external_resources = []

[lib]
name = "nte_dps_tool"
path = "src/lib.rs"

[[bin]]
name = "nte-core"
path = "src/bin/nte-core.rs"
required-features = ["cli"]

[[bin]]
name = "nte-updater"
path = "src/bin/nte-updater.rs"
required-features = ["desktop"]

[dependencies]
anyhow = "1.0"
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
crossbeam-channel = "0.5"
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"], optional = true }
hex = "0.4"
libloading = "0.8"
pcap-file = "2.0"
semver = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.11", default-features = false, optional = true }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
debug = false

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
serde_json = "1.0"
winresource = "0.1.31"
