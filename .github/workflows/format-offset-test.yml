name: Format offset scanner test

on:
  push:
    branches:
      - agent/sdk-cache-0.3.9

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sdk-cache-0.3.9
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply rustfmt
        shell: pwsh
        run: cargo fmt --all
      - name: Commit formatting update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/platform/mods_plugin.rs
          if (git diff --cached --quiet) { throw 'cargo fmt produced no target-file changes' }
          git diff --cached --check
          git commit -m "style: format offset resolver source guard"
          git push origin HEAD:agent/sdk-cache-0.3.9
