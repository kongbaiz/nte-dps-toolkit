name: PR50 rustfmt fix

on:
  push:
    branches:
      - fix/zankou-authoritative-assets

permissions:
  contents: write

jobs:
  patch-rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/zankou-authoritative-assets
          fetch-depth: 0

      - name: Apply rustfmt shape to Zankou assertion
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/engine/parser.rs")
          text = path.read_text(encoding="utf-8")
          new = '        assert_eq!(zankou_dot.ability_name.as_deref(), Some("GA_Zankou_Melee"));'
          pattern = re.compile(
              r'^        assert_eq!\(\n'
              r'\s+zankou_dot\.ability_name\.as_deref\(\),\n'
              r'\s+Some\("GA_Zankou_Melee"\)\n'
              r'        \);$',
              re.MULTILINE,
          )
          updated, count = pattern.subn(new, text, count=1)
          if count == 1:
              path.write_text(updated, encoding="utf-8")
              print("applied rustfmt shape")
          elif new in text:
              print("rustfmt shape already applied")
          else:
              raise SystemExit("unexpected Zankou assertion state")
          PY

      - name: Commit formatting fix
        shell: bash
        run: |
          if git diff --quiet -- src/engine/parser.rs; then
            echo "No parser.rs change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/parser.rs
          git commit -m "style: format Zankou parser assertion"
          git push origin HEAD:fix/zankou-authoritative-assets
