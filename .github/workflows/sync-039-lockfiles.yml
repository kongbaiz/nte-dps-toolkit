name: Sync 0.3.9 lockfiles

on:
  push:
    branches:
      - agent/sdk-cache-0.3.9

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sdk-cache-0.3.9
          fetch-depth: 0
      - name: Update local package versions only
        shell: pwsh
        run: |
          $paths = @('Cargo.lock', 'src-tauri/Cargo.lock')
          foreach ($path in $paths) {
            $text = [IO.File]::ReadAllText($path)
            $text = $text.Replace("name = `"nte-dps-tool`"`r`nversion = `"0.3.8`"", "name = `"nte-dps-tool`"`r`nversion = `"0.3.9`"")
            $text = $text.Replace("name = `"nte-dps-tool`"`nversion = `"0.3.8`"", "name = `"nte-dps-tool`"`nversion = `"0.3.9`"")
            $text = $text.Replace("name = `"nte-dps-tool-tauri`"`r`nversion = `"0.3.8`"", "name = `"nte-dps-tool-tauri`"`r`nversion = `"0.3.9`"")
            $text = $text.Replace("name = `"nte-dps-tool-tauri`"`nversion = `"0.3.8`"", "name = `"nte-dps-tool-tauri`"`nversion = `"0.3.9`"")
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          }
      - name: Commit lockfile version sync
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock src-tauri/Cargo.lock
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "chore: sync Cargo lockfiles for 0.3.9"
          git push origin HEAD:agent/sdk-cache-0.3.9
