name: Build

on:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "src-tauri/**"
      - "frontend/**"
      - "native/**"
      - "plugins/**"
      - "res/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "docs/**"
      - "README.md"
      - "README_EN.md"
      - "THIRD_PARTY_LICENSES.md"
      - "scripts/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - master
    paths:
      - "src/**"
      - "src-tauri/**"
      - "frontend/**"
      - "native/**"
      - "plugins/**"
      - "res/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "docs/**"
      - "README.md"
      - "README_EN.md"
      - "THIRD_PARTY_LICENSES.md"
      - "scripts/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPX_VERSION: 5.2.0
  UPX_SHA256: b471ebf1b7f20f4a89150264ed9a008a2a5bfd247f3c6d1184a75bb59ca08f5d
  NTE_UPDATE_KEY_ID: ${{ vars.NTE_UPDATE_KEY_ID }}
  NTE_UPDATE_PUBLIC_KEY_HEX: ${{ vars.NTE_UPDATE_PUBLIC_KEY_HEX }}
  NTE_UPDATE_MANIFEST_URL: ${{ vars.NTE_UPDATE_MANIFEST_URL }}

jobs:
  windows-release:
    name: Windows quality gates and release build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        # stable is a rolling branch and cannot be pinned by SHA; the project
        # pins its minimum toolchain via rust-version in both Cargo.toml files.

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Validate official update channel
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NTE_UPDATE_KEY_ID)) {
            throw "NTE_UPDATE_KEY_ID must be configured for an official build"
          }
          if ($env:NTE_UPDATE_PUBLIC_KEY_HEX -notmatch '^[0-9A-Fa-f]{64}$') {
            throw "NTE_UPDATE_PUBLIC_KEY_HEX must contain exactly 32 bytes of hexadecimal data"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:NTE_UPDATE_MANIFEST_URL)) {
            try {
              $manifestUri = [Uri]$env:NTE_UPDATE_MANIFEST_URL
            } catch {
              throw "NTE_UPDATE_MANIFEST_URL must be an absolute HTTPS URL"
            }
            if (-not $manifestUri.IsAbsoluteUri -or $manifestUri.Scheme -ne "https") {
              throw "NTE_UPDATE_MANIFEST_URL must be an absolute HTTPS URL"
            }
          }

      - name: Build native NTE Mods Plugin
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Visual Studio with the MSVC x64 toolset was not found"
          }

          $msbuild = Join-Path $installation "MSBuild\Current\Bin\MSBuild.exe"
          & $msbuild `
            native/nte-mods-plugin/nte-mods-plugin.sln `
            /t:Clean,Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path -LiteralPath plugins/dwmapi.dll -PathType Leaf)) {
            throw "Native build did not stage plugins/dwmapi.dll"
          }
          $pluginText = [Text.Encoding]::ASCII.GetString(
            [IO.File]::ReadAllBytes("plugins/dwmapi.dll")
          )
          foreach ($requiredApi in @(
            "NTE_DPS_TOOL_MODS_PLUGIN_V1",
            "game.session",
            "game.player_controller",
            "game.player_state",
            "combat_clock.pause_mask",
            "combat_clock.state_flags"
          )) {
            if (-not $pluginText.Contains($requiredApi)) {
              throw "NTE Mods Plugin is missing the bundled-script API: $requiredApi"
            }
          }
          foreach ($script in @(
            "plugins/nte-mods.enabled",
            "plugins/nte-mods/equipment.nte",
            "plugins/nte-mods/combat-clock.nte"
          )) {
            if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
              throw "NTE Mods Plugin script is missing: $script"
            }
          }
          foreach ($program in @(
            "plugins/nte-mods/equipment.nte",
            "plugins/nte-mods/combat-clock.nte"
          )) {
            $source = Get-Content -LiteralPath $program -Raw
            if (-not $source.StartsWith("#include <nte/mod.hpp>") -or -not $source.Contains("NTE_SCRIPT(5);")) {
              throw "NTE Mods Plugin program is not NTE C++ v5: $program"
            }
          }

      - name: Check formatting
        run: cargo fmt --check

      - name: Check shared desktop build
        run: cargo check

      - name: Test shared desktop build
        run: cargo test

      - name: Check Tauri and CLI targets
        shell: pwsh
        run: |
          cargo fmt --check --manifest-path src-tauri/Cargo.toml
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo check --bin nte-core --no-default-features --features cli

      - name: Lint desktop, Tauri, and CLI targets
        shell: pwsh
        run: |
          cargo clippy --all-targets --features desktop -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features --features cli -- -D warnings

      - name: Test Tauri and CLI targets
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo test --no-default-features --features cli
          cargo test --features external_resources

      - name: Check frontend
        shell: pwsh
        run: |
          pnpm --dir frontend lint
          pnpm --dir frontend typecheck
          pnpm --dir frontend test

      - name: Verify architecture policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify_architecture.ps1

      - name: Verify runtime safety policy
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify_runtime_safety.ps1

      - name: Audit Rust dependency vulnerabilities
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit --deny warnings

      - name: Build release variants
        shell: pwsh
        run: |
          pnpm --dir frontend tauri:build --no-bundle --ci
          cargo build --release --bin nte-updater --features desktop
          New-Item -ItemType Directory -Force dist/nte-dps-tool-windows-x64 | Out-Null
          Copy-Item src-tauri/target/release/nte-dps-tool.exe dist/nte-dps-tool-windows-x64/
          Copy-Item target/release/nte-updater.exe dist/nte-dps-tool-windows-x64/
          Copy-Item plugins dist/nte-dps-tool-windows-x64/plugins -Recurse

          cargo build --release --bin nte-core --no-default-features --features cli
          New-Item -ItemType Directory -Force dist/nte-core-windows-x64 | Out-Null
          Copy-Item target/release/nte-core.exe dist/nte-core-windows-x64/
          Copy-Item docs/CLI_PROTOCOL.md dist/nte-core-windows-x64/
          Copy-Item docs/CLI_PROTOCOL_ZH.md dist/nte-core-windows-x64/
          Copy-Item docs/examples dist/nte-core-windows-x64/examples -Recurse

          pnpm --dir frontend tauri:build --no-bundle --ci --features external_resources
          New-Item -ItemType Directory -Force dist/nte-dps-tool-windows-external-resources | Out-Null
          Copy-Item src-tauri/target/release/nte-dps-tool.exe dist/nte-dps-tool-windows-external-resources/
          Copy-Item target/release/nte-updater.exe dist/nte-dps-tool-windows-external-resources/
          Copy-Item res dist/nte-dps-tool-windows-external-resources/res -Recurse
          Copy-Item plugins dist/nte-dps-tool-windows-external-resources/plugins -Recurse

      - name: Compress release executables with UPX
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP/upx-$env:UPX_VERSION-win64.zip"
          $upxRoot = "$env:RUNNER_TEMP/upx"
          Invoke-WebRequest `
            -Uri "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip" `
            -OutFile $archive

          $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:UPX_SHA256) {
            throw "UPX archive checksum mismatch: expected $env:UPX_SHA256, got $actualHash"
          }

          Expand-Archive -Path $archive -DestinationPath $upxRoot -Force
          $upx = Get-ChildItem -Path $upxRoot -Filter upx.exe -Recurse | Select-Object -First 1
          if (-not $upx) {
            throw "upx.exe was not found in the downloaded archive"
          }

          $executables = @(Get-ChildItem -Path dist -Filter *.exe -Recurse)
          if ($executables.Count -eq 0) {
            throw "No release executables were found under dist"
          }

          foreach ($executable in $executables) {
            & $upx.FullName -9 $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "UPX compression failed for $($executable.FullName)"
            }

            & $upx.FullName -t $executable.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "UPX integrity test failed for $($executable.FullName)"
            }
          }

      - name: Prepare release packages
        shell: pwsh
        run: |
          $variantNotes = @{
            "nte-dps-tool-windows-x64" = @"
          # NTE DPS Tool - Windows x64

          - Standard Tauri desktop release with F12, Packets, Resources, and Diagnostics available.
          - Runtime resources are embedded in the executable.
          - Includes nte-updater.exe for official-channel updates.
          - The optional in-game mod loader uses plugins/dwmapi.dll plus restricted NTE C++ v5 Mods under plugins/nte-mods and is installed only after the timed risk confirmation.
          - JSON resources are minified during embedding, and PNG resources may be embedded as smaller WebP bytes.
          - The executable is compressed with UPX -9 and integrity-tested before packaging.
          "@
            "nte-core-windows-x64" = @"
          # NTE Core - Windows x64

          - Local JSON-RPC 2.0 over NDJSON stdio sidecar for third-party integrations.
          - Does not open a network port and does not include desktop UI images or windowing dependencies.
          - Read CLI_PROTOCOL.md or CLI_PROTOCOL_ZH.md before integrating.
          - The executable is compressed with UPX -9 and integrity-tested before packaging.
          "@
            "nte-dps-tool-windows-external-resources" = @"
          # NTE DPS Tool - Windows External Resources Variant

          - Standard Tauri desktop release with F12 and all diagnostics available.
          - Runtime resources are not embedded in the executable.
          - Includes nte-updater.exe for official-channel updates.
          - The optional in-game mod loader uses plugins/dwmapi.dll plus restricted NTE C++ v5 Mods under plugins/nte-mods and is installed only after the timed risk confirmation.
          - Keep the bundled res directory beside nte-dps-tool.exe.
          - Use this build when minimizing executable size or updating resources without rebuilding the binary.
          - The executable is compressed with UPX -9 and integrity-tested before packaging.
          "@
          }

          foreach ($variant in $variantNotes.Keys) {
            Copy-Item THIRD_PARTY_LICENSES.md "dist/$variant/"
            $variantNotes[$variant] | Set-Content -Encoding UTF8 "dist/$variant/BUILD_VARIANT.md"
            Compress-Archive -Path "dist/$variant/*" -DestinationPath "$variant.zip" -Force
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nte-windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            nte-dps-tool-windows-x64.zip
            nte-core-windows-x64.zip
            nte-dps-tool-windows-external-resources.zip

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
            $PSNativeCommandUseErrorActionPreference = $false
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $crateVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $releaseTag = "v$crateVersion-build-$env:GITHUB_RUN_NUMBER-$shortSha"
          $releaseNotesPath = "docs/releases/$crateVersion.md"
          if (-not (Test-Path -LiteralPath $releaseNotesPath -PathType Leaf)) {
            throw "Release notes are missing: $releaseNotesPath"
          }
          $releaseNotes = (Get-Content -LiteralPath $releaseNotesPath -Raw -Encoding UTF8).Trim()
          if ([string]::IsNullOrWhiteSpace($releaseNotes)) {
            throw "Release notes are empty: $releaseNotesPath"
          }
          $notes = @(
            $releaseNotes
            ""
            "---"
            "Build: $env:GITHUB_SHA"
          ) -join "`n"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $releaseTag $env:GITHUB_SHA
          git push origin "refs/tags/$releaseTag"

          gh release create $releaseTag `
            nte-dps-tool-windows-x64.zip `
            nte-core-windows-x64.zip `
            nte-dps-tool-windows-external-resources.zip `
            --title "v$crateVersion" `
            --notes $notes `
            --latest
